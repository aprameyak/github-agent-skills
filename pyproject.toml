[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-agent-skills"
version = "0.1.0"
description = "Local skills and CLI for inspecting and tidying a GitHub account via gh."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Aprameya Kannan" }
]
keywords = [
  "github",
  "github-cli",
  "ai-agents",
  "agent-skills",
  "developer-tools",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
github-agent = "github_agent.cli:main"

[project.urls]
Homepage = "https://github.com/aprameyak/github-agent-skills"
Repository = "https://github.com/aprameyak/github-agent-skills"
Issues = "https://github.com/aprameyak/github-agent-skills/issues"

[tool.setuptools.packages.find]
include = ["github_agent*"]

[tool.setuptools.package-data]
github_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
