name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: |
          github-agent --help
          github-agent checkup --snapshot tests/fixtures/new_user.json
          github-agent findings --snapshot tests/fixtures/student.json --skill github-cleanup > /tmp/findings.json
          test -s /tmp/findings.json
      - name: Installer dry-run
        if: matrix.python-version == '3.12'
        run: ./install.sh --dry-run --agents cursor
